[package]
name = "miaudit-ui"
edition.workspace = true
version.workspace = true

[dependencies]
miaudit-schema = { path = "../miaudit-schema" }
miaudit-web = { path = "../miaudit-web" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"
